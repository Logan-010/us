<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>us — URL shortener</title>
    <link rel="icon" href="/icon.png">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <h1>us</h1>
      <p>Shorten a link.</p>
      <form action="/new" method="post">
        <label for="url">URL</label>
        <input id="url" name="url" type="url" placeholder="https://example.com" required>
        <label for="secret">Secret</label>
        <input id="secret" name="secret" type="password" required>
        <button type="submit">Shorten</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <a id="result" hidden></a>
      <noscript><p>Enable JavaScript to display the shortened link here.</p></noscript>
    </main>
    <script>
      const form = document.querySelector('form');
      const button = form.querySelector('button');
      const status = document.querySelector('#status');
      const result = document.querySelector('#result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        status.textContent = 'Shortening…';
        result.hidden = true;

        try {
          const response = await fetch(form.action, {
            method: 'POST',
            body: new URLSearchParams(new FormData(form)),
          });

          if (!response.ok) {
            status.textContent = response.status === 401
              ? 'Incorrect secret. Please try again.'
              : 'Could not shorten this link. Please try again.';
            return;
          }

          const code = (await response.text()).trim();
          if (!code) throw new Error('Empty response');
          const link = new URL('/su/' + encodeURIComponent(code), window.location.origin);
          result.href = link.href;
          result.textContent = link.href;
          result.hidden = false;
          status.textContent = 'Your short link:';
        } catch {
          status.textContent = 'Could not reach the server. Please try again.';
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
